<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Zombie Strawberries</title>

<meta name="theme-color" content="#050508">

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    background:#050508;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

main{
    width:min(90%,500px);
    padding:30px;
}

h1{
    margin-top:0;
    font-size:2rem;
}

p{
    opacity:.85;
    line-height:1.5;
}

#choices{
    display:none;
    margin-top:25px;
}

a{
    display:block;
    margin:12px 0;
    padding:15px;
    border-radius:10px;
    text-decoration:none;
    background:#b31325;
    color:white;
    font-weight:bold;
    transition:.2s;
}

a:hover{
    background:#d51d34;
}
</style>

</head>
<body>

<main>

<h1>🍓 Zombie Strawberries</h1>

<p id="status">
Preparing the best version for your device...
</p>

<div id="choices">

<a href="./ios/">
Play iPhone / iPad Version
</a>

<a href="./android/">
Play Android / Desktop Version
</a>

</div>

</main>

<script>

const params = new URLSearchParams(window.location.search);

const forcedBuild = params.get("build");

function go(path){
    window.location.replace(path);
}

if(forcedBuild==="ios"){
    go("./ios/");
}

if(forcedBuild==="android"){
    go("./android/");
}

const ua = navigator.userAgent;

const platform = navigator.platform;

const isAndroid = /Android/i.test(ua);

const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (
        platform==="MacIntel" &&
        navigator.maxTouchPoints>1
    );

const isSafari =
    /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(ua);

if(isIOS){
    go("./ios/");
}
else if(isAndroid){
    go("./android/");
}
else if(isSafari){
    // macOS Safari
    go("./ios/");
}
else{
    // Chrome, Edge, Firefox, Windows, Linux, etc.
    go("./android/");
}

// If something goes wrong...
setTimeout(()=>{

    document.getElementById("status").textContent=
        "Couldn't determine your device. Please choose a version below.";

    document.getElementById("choices").style.display="block";

},1500);

</script>

</body>
</html>
