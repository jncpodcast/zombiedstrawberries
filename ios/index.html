<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Zombie Strawberries</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #050508;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .loading {
      padding: 24px;
    }

    .fallback {
      margin-top: 20px;
      display: none;
    }

    a {
      display: inline-block;
      margin: 6px;
      padding: 12px 18px;
      color: white;
      background: #b31325;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="loading">
    <h1>Zombie Strawberries</h1>
    <p id="status">Preparing your game…</p>

    <div class="fallback" id="fallback">
      <p>Choose your version:</p>
      <a href="./ios/">iPhone / iPad</a>
      <a href="./android/">Android</a>
    </div>
  </main>

  <script>
    (() => {
      const userAgent = navigator.userAgent || "";
      const platform = navigator.platform || "";

      const isAndroid = /Android/i.test(userAgent);

      // Standard iPhone, iPad and iPod detection.
      const isStandardIOS = /iPhone|iPad|iPod/i.test(userAgent);

      // Modern iPads may identify themselves as Macintosh computers.
      const isModernIPad =
        platform === "MacIntel" &&
        navigator.maxTouchPoints > 1;

      const isIOS = isStandardIOS || isModernIPad;

      let destination = "";

      if (isIOS) {
        destination = "./ios/";
      } else if (isAndroid) {
        destination = "./android/";
      }

      if (destination) {
        window.location.replace(destination);
        return;
      }

      // Desktop or an unrecognized device:
      document.getElementById("status").textContent =
        "Select the version you would like to play.";

      document.getElementById("fallback").style.display = "block";
    })();
  </script>
</body>
</html>
